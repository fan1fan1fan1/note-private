<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 上述3个meta标签*必须*放在最前面，任何其他内容都*必须*跟随其后！ -->


    <title>Bootstrap 101 Template</title>



    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
        integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">

    <!-- HTML5 shim 和 Respond.js 是为了让 IE8 支持 HTML5 元素和媒体查询（media queries）功能 -->
    <!-- 警告：通过 file:// 协议（就是直接将 html 页面拖拽到浏览器中）访问页面时 Respond.js 不起作用 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.jsdelivr.net/npm/html5shiv@3.7.3/dist/html5shiv.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/respond.js@1.4.2/dest/respond.min.js"></script>
    <![endif]-->



    <!-- 引入bootstrap -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">



    <style>
        [class^="col"] {
            border: 1px solid #ccc;
        }

        .row>div {
            height: 50px;
            /* 此处不能写margin */
        }
    </style>
</head>

<body>
    <h1>你好，世界！</h1>

    123

    <button type="button" class="btn btn-success">(成功)Success</button>



    <!-- Bootstrap布局容器
        Bootstrap需要为页面内容和栅格系统包裹一个.container容器，Bootstarp预先定义好了这个类，叫.container
        它提供了两个作此用处的类。
        1.container类
            响应式布局的容器 固定宽度
            大屏(>=12d)px) 宽度定为1170px       中屏(>=992px) 宽度定为 970px
            小屏(>=768px)  宽度定为 750px       超小屏 (100%)
        2.container-fluid类
            流式布局容器 百分百宽度
            占据全部视口(viewport)的容器。
            适合于单独做移动端开发
    -->

    <!-- 快捷   .container -->
    <div class="container">123</div>
    <div class="container-fluid">123</div>



    <!-- Bootstrap栅格系统 
        栅格系统英文为“gridsystems”，也有人翻译为“网格系统”，它是指将页面布局划分为等宽的列，然后通过列数的定义来模块化页面布局。
        Bootstrap提供了一套响应式、移动设备优先的流式栅格系统，随着屏幕或视口(viewport)尺寸的增加，系统会自动分为最多12列。
        Bootstrap里面container宽度是固定的，但是不同屏幕下，container的宽度不同，我们再把container划分为12等份。

        3.2栅格选项参数
        栅格系统用于通过一系列的行(row)与列(column)的组合来创建页面布局，你的内容就可以放入这些创建好的布局中。
                        超小屏幕（手机）    小屏设备（平板） 中等屏幕（桌面显示器）宽屏设备（大桌面显示器）
                        <768px              >=768px        >=992px             >=1200px
        .container      最大宽度自动(100%)   750px          970px               1170px
        类前缀          .col-xs-            .col-sm-       .col-md-            .col-lg-
        列(column)数                                 12

        行(row)必须放到container布局容器里面
        我们实现列的平均划分 需要给列添加类前缀
        xs-extra small：超小；sm-small:小；md-medium：中等；lg-large：大；
        列(column)大于12，多余的“列(column)”所在的元素将被作为一个整体另起一行排列
        每一列默认有左右15像素的padding
        可以同时为一列指定多个设备的类名，以便划分不同份数 例如 class="col-md-4 col-sm-6"

        按照不同屏幕划分为1~12等份
        行(row)可以去除父容器作用15px的边距
        xs-extra small：超小；sm-small：小；md-medium：中等；lg-large：大；
        列(column)大于12，多余的“列(column)”所在的元素将被作为一个整体另起一行排列
        每一列默认有左右15像素的padding
        可以同时为一列指定多个设备的类名，以便划分不同份数 例如 class="col-md-4 col-sm-6"

        如果超过12 会自动换行
     -->

    <!-- 已知最大12份 横向四个格子 各自占1/3 -->
    <div class="container">
        <div class="row">
            <div class="col-lg-3">1</div>
            <div class="col-lg-3">2</div>
            <div class="col-lg-3">3</div>
            <div class="col-lg-3">4</div>
        </div>
    </div>

    <!-- 手动设定每个盒子自适应 -->
    <div class="container">
        <div class="row">
            <div class="col-lg-3 col-md-4 col-sm-6 col-xs-12">1</div>
            <div class="col-lg-3 col-md-4 col-sm-6 col-xs-12">2</div>
            <div class="col-lg-3 col-md-4 col-sm-6 col-xs-12">3</div>
            <div class="col-lg-3 col-md-4 col-sm-6 col-xs-12">4</div>
        </div>
    </div>



    <!-- 列嵌套 -->
    <!-- 栅格系统内置的栅格系统将内容再次嵌套。简单理解就是一个列内再分成若干份小列。
     我们可以通过添加一个新的.row元素和一系列.col-sm-*元素到已经存在的.col-sm-*元素内。 
     -->
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="row">
                    <!-- 最好有上方的row盒子再涵盖一层 -->
                    <div class="col-sm-6">a</div>
                    <div class="col-sm-6">b</div>
                </div>
            </div>
            <div class="col-md-4">2</div>
            <div class="col-md-4">3</div>
        </div>
    </div>



    <!-- 列偏移 -->
    <!-- 使用.col-md-offset-*类可以将列向右侧偏移。这些类实际是通过使用*选择器为当前元素增加了左侧的边距(marqin) -->
    <div class="container">
        <div class="row">
            <div class="col-md-4">左侧</div>
            <div class="col-md-4 col-md-offset-4">右侧</div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-3">左侧</div>
            <div class="col-md-3 col-md-offset-6">右侧</div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-8 col-md-offset-2">中间</div>
        </div>
    </div>



    <!-- 列排序 -->
    <!-- 通过使用.col-md-push-*和.col-md-pull-*类就可以很容易的改变列(column)的顺序。 -->
    <div class="container">
        <div class="row">
            <div class="col-md-4 col-md-push-8">左侧</div>
            <div class="col-md-8 col-md-pull-4">右侧</div>
        </div>
    </div>



    <!-- 响应式工具 -->
    <!-- 为了加快对移动设备友好的页面开发工作，利用媒体查询功能，并使用这些工具类可以方便的针对不同设备展示或隐藏页面内容。
            类名   超小屏 小屏  中屏  大屏
        .hidden-xs 隐藏   可见  可见  可见
        .hidden-sm 可见   隐藏  可见  可见
        .hidden-md 可见   可见  隐藏  可见
        .hidden-lg 可见   可见  可见  隐藏

    与之相反的，是visible-xs visible-sm visible-mdvisible-lg是显示某个页面内容
    -->
    <div class="container">
        <div class="row">
            <div class="col-lg-3">1</div>
            <div class="col-lg-3">2</div>
            <div class="col-lg-3 hidden-md">3</div>
            <div class="col-lg-3">4</div>
        </div>
    </div>




    <!-- js -->
    <!-- jQuery (Bootstrap 的所有 JavaScript 插件都依赖 jQuery，所以必须放在前边) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"
        integrity="sha384-nvAa0+6Qg9clwYCGGPpDQLVpLNn0fRaROjHqs13t4Ggj3Ez50XnGQqc/r8MhnRDZ"
        crossorigin="anonymous"></script>
    <!-- 加载 Bootstrap 的所有 JavaScript 插件。你也可以根据需要只加载单个插件。 -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"
        integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd"
        crossorigin="anonymous"></script>
</body>
